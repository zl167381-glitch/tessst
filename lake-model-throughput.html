<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog</title>
<style>
  :root {
    --ink: #1d1d1f;
    --ink-60: #6e6e73;
    --ink-30: #b0b0b5;
    --ink-15: #d2d2d7;
    --hairline: #e5e5ea;
    --track: #f5f5f7;
    --canvas: #ffffff;
    --primary: #0071e3;
    --warn: #ff9f0a;
    --stock-up: #ff9f0a;
    --stock-up-ink: #c45500;
    --stock-down: #34c759;
    --stock-down-ink: #1b8a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--canvas);
    color: var(--ink);
    font-family: "SF Pro Text", -apple-system, system-ui, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","ss02","tnum";
  }
  .display {
    font-family: "SF Pro Display", -apple-system, system-ui, "PingFang SC", sans-serif;
    font-weight: 600; letter-spacing: -0.03em; line-height: 1.05;
  }
  .eyebrow {
    font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
    color: var(--primary); text-transform: uppercase;
  }

  .page { max-width: 1200px; margin: 0 auto; padding: 128px 48px; }

  header { text-align: center; margin-bottom: 128px; }
  header .eyebrow { display: block; margin-bottom: 20px; }
  header h1 { font-size: 56px; }
  header .sub {
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-size: 19px; font-weight: 400; line-height: 1.5;
    color: var(--ink-60); margin-top: 20px; letter-spacing: -0.01em;
    max-width: 560px; margin-left: auto; margin-right: auto;
  }

  /* two-column grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 96px;
    align-items: start;
  }
  .col .col-eyebrow {
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-size: 13px;
    color: var(--ink-60);
    letter-spacing: 0.02em;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--hairline);
    display: block;
  }
  .col .col-eyebrow b {
    color: var(--ink); font-weight: 600; font-size: 15px;
    margin-right: 8px;
    letter-spacing: -0.01em;
  }

  /* ============ LEFT: indicators + queue ============ */
  .indicators {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 32px; margin-bottom: 48px;
  }
  .ind .k {
    font-size: 12px; color: var(--ink-60);
    letter-spacing: 0.02em; margin-bottom: 10px;
    display: block;
  }
  .ind .v {
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 40px; font-weight: 500; letter-spacing: -0.03em;
    line-height: 1; color: var(--ink);
    display: block;
  }
  .ind .v .u {
    font-size: 18px; color: var(--ink-30);
    font-weight: 400; margin-left: 6px; letter-spacing: -0.01em;
  }
  .ind .cap {
    font-size: 12px; color: var(--ink-30);
    margin-top: 10px; letter-spacing: -0.005em;
  }

  /* queue block */
  .queue { }
  .q-flows {
    display: flex; justify-content: space-between;
    margin-bottom: 20px; align-items: flex-end;
  }
  .q-flows .s .k {
    font-size: 12px; color: var(--ink-60);
    letter-spacing: 0.02em; margin-bottom: 6px;
  }
  .q-flows .s .v {
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 32px; font-weight: 500; letter-spacing: -0.02em; line-height: 1;
  }
  .q-flows .s.in .v  { color: var(--primary); }
  .q-flows .s.out .v { color: var(--ink); }
  .q-flows .s.out { text-align: right; }

  .queue-caption {
    text-align: center;
    margin-top: 22px;
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--ink-60);
    letter-spacing: -0.005em;
  }
  .queue-caption b { color: var(--ink); font-weight: 500; }
  .queue-caption .plus { color: var(--warn); font-weight: 500; }

  /* left column split + bar chart */
  .left-split {
    height: 1px; background: var(--hairline);
    margin: 56px 0 40px;
  }
  .stock-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stock-history .sub-eyebrow {
    font-size: 12px; color: var(--ink-60);
    letter-spacing: 0.02em; margin-bottom: 0;
  }
  .stock-legend {
    display: flex; gap: 16px;
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-size: 12px; color: var(--ink-60);
  }
  .stock-legend .lg { display: flex; align-items: center; gap: 6px; }
  .stock-legend .sw { width: 8px; height: 8px; border-radius: 2px; }
  .stock-history .stock-caption {
    text-align: center;
    margin-top: 20px;
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-60);
    letter-spacing: -0.005em;
  }
  .stock-history .stock-caption b { color: var(--ink); font-weight: 500; }

  /* ============ RIGHT: history chart ============ */
  .chart-legend {
    display: flex; gap: 24px;
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-size: 12px; color: var(--ink-60);
    margin-bottom: 24px;
  }
  .chart-legend .lg { display: flex; align-items: center; gap: 8px; }
  .chart-legend .sw { width: 16px; height: 2px; border-radius: 2px; }

  .chart-caption {
    margin-top: 24px;
    font-family: "SF Pro Display", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 14px; color: var(--ink-60); line-height: 1.5;
  }
  .chart-caption b { color: var(--ink); font-weight: 500; }

  footer {
    margin-top: 160px; padding-top: 32px;
    border-top: 1px solid var(--hairline);
    color: var(--ink-30); font-size: 11px; text-align: center;
    letter-spacing: 0.06em;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }

  @media (max-width: 900px) {
    .page { padding: 72px 24px; }
    header { margin-bottom: 72px; }
    header h1 { font-size: 34px; }
    header .sub { font-size: 16px; }
    .grid { grid-template-columns: 1fr; gap: 96px; }
    .ind .v { font-size: 32px; }
  }
</style>
</head>
<body>

<main class="page">

  <header>
    <span class="eyebrow">Backlog</span>
    <h1 class="display">本月的进与出，<br>六月的走向。</h1>
    <p class="sub">左边是本月队列的动作和到岸时间，右边是过去六个月的收支。</p>
  </header>

  <section class="grid">

    <!-- ============ LEFT ============ -->
    <div class="col left">
      <span class="col-eyebrow"><b>本月</b>完成 18 个需求处理，预计 7 个月完成需求清理</span>

      <!-- Queue block -->
      <div class="queue">
        <svg viewBox="0 0 500 140" style="width:100%; display:block;" role="img" aria-label="队列">
          <defs>
            <linearGradient id="newCell" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0071e3" stop-opacity="0.18"/>
              <stop offset="1" stop-color="#0071e3" stop-opacity="0.05"/>
            </linearGradient>
            <linearGradient id="popCell" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1d1d1f" stop-opacity="0.05"/>
              <stop offset="1" stop-color="#1d1d1f" stop-opacity="0.02"/>
            </linearGradient>
          </defs>

          <!-- TOP annotations — tick 与对应色段等宽 -->
          <!-- 新增 24 → 4 blue cells (x=58..184) -->
          <text x="121" y="14" text-anchor="middle"
                font-family="SF Mono, monospace" font-size="10" fill="#0071e3" letter-spacing="0.06em">
            新增 24
          </text>
          <line x1="58" y1="22" x2="184" y2="22" stroke="#0071e3" stroke-width="1"/>

          <!-- 完成 18 → 3 gray cells outside (x=358..452) -->
          <text x="405" y="14" text-anchor="middle"
                font-family="SF Mono, monospace" font-size="10" fill="#1d1d1f" letter-spacing="0.06em">
            完成 18
          </text>
          <line x1="358" y1="22" x2="452" y2="22" stroke="#1d1d1f" stroke-width="1"/>

          <!-- container hairline: holds 4 blue + 4 ink = 存量 45 (示意比例) -->
          <rect x="48" y="34" width="274" height="60" rx="6"
                fill="none" stroke="#e5e5ea" stroke-width="1"/>

          <!-- inflow arrow (left) -->
          <line x1="20" y1="64" x2="46" y2="64" stroke="#0071e3" stroke-width="1.5"/>
          <path d="M40,60 L46,64 L40,68 Z" fill="#0071e3"/>

          <!-- outflow arrow (right, from container to gray zone) -->
          <line x1="328" y1="64" x2="354" y2="64" stroke="#1d1d1f" stroke-width="1.5"/>
          <path d="M348,60 L354,64 L348,68 Z" fill="#1d1d1f"/>

          <!-- INSIDE: 4 blue (新增) + 4 ink (历史剩余) -->
          <g>
            <!-- 4 blue -->
            <g stroke="#0071e3" stroke-width="1" fill="url(#newCell)">
              <rect x="58"  y="42" width="30" height="44" rx="3"/>
              <rect x="90"  y="42" width="30" height="44" rx="3"/>
              <rect x="122" y="42" width="30" height="44" rx="3"/>
              <rect x="154" y="42" width="30" height="44" rx="3"/>
            </g>
            <!-- 4 ink -->
            <g fill="#1d1d1f" opacity="0.9">
              <rect x="186" y="42" width="30" height="44" rx="3"/>
              <rect x="218" y="42" width="30" height="44" rx="3"/>
              <rect x="250" y="42" width="30" height="44" rx="3"/>
              <rect x="282" y="42" width="30" height="44" rx="3"/>
            </g>
          </g>

          <!-- OUTSIDE: 3 gray (完成) -->
          <g stroke="#d2d2d7" stroke-width="1" stroke-dasharray="2,2" fill="url(#popCell)">
            <rect x="358" y="42" width="30" height="44" rx="3"/>
            <rect x="390" y="42" width="30" height="44" rx="3"/>
            <rect x="422" y="42" width="30" height="44" rx="3"/>
          </g>

          <!-- BOTTOM annotation: 存量 45 = 蓝 + 墨 (x=58..312) -->
          <line x1="58" y1="102" x2="312" y2="102" stroke="#1d1d1f" stroke-width="1"/>
          <text x="185" y="120" text-anchor="middle"
                font-family="SF Mono, monospace" font-size="10" fill="#1d1d1f" letter-spacing="0.06em">
            当月存量 45<tspan fill="#ff9f0a" font-weight="600">（＋6）</tspan>
          </text>
        </svg>
      </div>

      <div class="left-split"></div>

      <!-- Monthly stock bar chart -->
      <div class="stock-history">
        <div class="stock-head">
          <div class="sub-eyebrow">近六月存量</div>
          <div class="stock-legend">
            <span class="lg"><span class="sw" style="background:#ff9f0a;"></span>较上月新增</span>
            <span class="lg"><span class="sw" style="background:#34c759;"></span>较上月减少</span>
          </div>
        </div>

        <svg viewBox="0 0 500 160" style="width:100%; display:block;" role="img" aria-label="近六月存量。橙色为较上月新增，绿色为较上月减少。">
          <!-- baseline -->
          <line x1="20" y1="130" x2="480" y2="130" stroke="#e5e5ea" stroke-width="1"/>

          <!-- bars: width 40, centers at 40, 124, 208, 292, 376, 460 -->
          <!-- 较上月新增：四月 +2、五月 +5、六月 +6 -->
          <g fill="#ff9f0a">
            <rect x="20"  y="54" width="40" height="76"  rx="3"><title>四月 34，较上月新增</title></rect>
            <rect x="104" y="43" width="40" height="87"  rx="3"><title>五月 39，较上月新增</title></rect>
            <rect x="188" y="30" width="40" height="100" rx="3"><title>六月 45，较上月新增</title></rect>
          </g>
          <!-- 较上月减少：七月 −4、八月 −7、九月 −8 -->
          <g fill="#34c759">
            <rect x="272" y="39" width="40" height="91" rx="3"><title>七月 41，较上月减少</title></rect>
            <rect x="356" y="54" width="40" height="76" rx="3"><title>八月 34，较上月减少</title></rect>
            <rect x="440" y="72" width="40" height="58" rx="3"><title>九月 26，较上月减少</title></rect>
          </g>

          <!-- value labels above bars -->
          <g font-family="SF Pro Display, sans-serif" font-variant-numeric="tabular-nums" text-anchor="middle">
            <text x="40"  y="46" font-size="11" fill="#c45500">34</text>
            <text x="124" y="35" font-size="11" fill="#c45500">39</text>
            <text x="208" y="22" font-size="12" fill="#c45500" font-weight="600">45</text>
            <text x="292" y="31" font-size="11" fill="#1b8a3e">41</text>
            <text x="376" y="46" font-size="11" fill="#1b8a3e">34</text>
            <text x="460" y="64" font-size="11" fill="#1b8a3e">26</text>
          </g>

          <!-- month labels below -->
          <g font-family="SF Pro Display, sans-serif" font-size="12" text-anchor="middle" letter-spacing="0.02em">
            <text x="40"  y="150" fill="#6e6e73">四月</text>
            <text x="124" y="150" fill="#6e6e73">五月</text>
            <text x="208" y="150" fill="#1d1d1f" font-weight="500">六月</text>
            <text x="292" y="150" fill="#6e6e73">七月</text>
            <text x="376" y="150" fill="#6e6e73">八月</text>
            <text x="460" y="150" fill="#6e6e73">九月</text>
          </g>
        </svg>

        <p class="stock-caption">
          存量峰值 <b>六月 45</b>&nbsp;·&nbsp;之后三月连续消化至 <b>26</b>
        </p>
      </div>
    </div>

    <!-- ============ RIGHT ============ -->
    <div class="col right">
      <span class="col-eyebrow"><b>近六个月</b>流入流出</span>

      <div class="chart-legend">
        <span class="lg"><span class="sw" style="background:#0071e3;"></span>流入 · Inflow</span>
        <span class="lg"><span class="sw" style="background:#1d1d1f;"></span>流出 · Outflow</span>
      </div>

      <svg viewBox="0 0 700 460" style="width:100%; display:block;" role="img" aria-label="六个月流入流出">
        <g stroke="#f0f0f0" stroke-width="1">
          <line x1="30" y1="60"  x2="680" y2="60"/>
          <line x1="30" y1="160" x2="680" y2="160"/>
          <line x1="30" y1="260" x2="680" y2="260"/>
          <line x1="30" y1="360" x2="680" y2="360"/>
        </g>
        <g font-family="SF Mono, monospace" font-size="10" fill="#b0b0b5" text-anchor="end">
          <text x="24" y="64">30</text>
          <text x="24" y="164">20</text>
          <text x="24" y="264">10</text>
          <text x="24" y="364">0</text>
        </g>

        <!-- Inflow curve: Apr22, May26, Jun24, Jul22, Aug20, Sep18  → y = 360 - v*10 -->
        <path d="M 90,140
                 C 150,120 180,105 210,100
                 C 270,105 300,120 330,120
                 C 390,125 420,135 450,140
                 C 510,150 540,155 570,160
                 C 630,170 655,175 680,180"
              fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Outflow curve: Apr20, May21, Jun18, Jul26, Aug27, Sep26 -->
        <path d="M 90,160
                 C 150,155 180,155 210,150
                 C 270,170 300,180 330,180
                 C 390,135 420,110 450,100
                 C 510,95  540,90  570,90
                 C 630,95  655,97  680,100"
              fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Crossover marker between Jun (330) and Jul (450) -->
        <line x1="390" y1="40" x2="390" y2="380" stroke="#e5e5ea" stroke-width="1"/>
        <text x="390" y="30" text-anchor="middle"
              font-family="SF Mono, monospace" font-size="10" fill="#6e6e73" letter-spacing="0.06em">
          转折
        </text>

        <!-- Data points -->
        <g>
          <g fill="#ffffff" stroke="#0071e3" stroke-width="2">
            <circle cx="90"  cy="140" r="3.5"/>
            <circle cx="210" cy="100" r="3.5"/>
            <circle cx="330" cy="120" r="5" fill="#0071e3"/>
            <circle cx="450" cy="140" r="3.5"/>
            <circle cx="570" cy="160" r="3.5"/>
            <circle cx="680" cy="180" r="3.5"/>
          </g>
          <g fill="#ffffff" stroke="#1d1d1f" stroke-width="2">
            <circle cx="90"  cy="160" r="3.5"/>
            <circle cx="210" cy="150" r="3.5"/>
            <circle cx="330" cy="180" r="5" fill="#1d1d1f"/>
            <circle cx="450" cy="100" r="3.5"/>
            <circle cx="570" cy="90"  r="3.5"/>
            <circle cx="680" cy="100" r="3.5"/>
          </g>
        </g>

        <!-- Value labels near current month (六月) -->
        <text x="330" y="108"
              font-family="SF Pro Display, sans-serif" font-variant-numeric="tabular-nums"
              font-size="13" fill="#0071e3" font-weight="600" text-anchor="middle">24</text>
        <text x="330" y="200"
              font-family="SF Pro Display, sans-serif" font-variant-numeric="tabular-nums"
              font-size="13" fill="#1d1d1f" font-weight="600" text-anchor="middle">18</text>

        <!-- Month labels -->
        <g font-family="SF Pro Display, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle" letter-spacing="0.02em">
          <text x="90"  y="410">四月</text>
          <text x="210" y="410">五月</text>
          <text x="330" y="410" fill="#0071e3" font-weight="500">六月</text>
          <text x="450" y="410">七月</text>
          <text x="570" y="410">八月</text>
          <text x="680" y="410">九月</text>
        </g>
      </svg>

      <p class="chart-caption">
        七月是转折点：此前 <b>流入 &gt; 流出</b>，存量上涨；从七月起 <b>流出 &gt; 流入</b>，进入消化区。
      </p>
    </div>

  </section>

  <footer>
    Level = Prev Level + Inflow − Outflow
  </footer>

</main>

</body>
</html>
